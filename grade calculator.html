
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Grade Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000015;
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
        }

        label {
            display: block;
            margin-top: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            background: #f1f5f9;
            overflow-wrap: anywhere;
        }

        .error {
            color: #b91c1c;
        }

        .success {
            color: #166534;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Grade Calculator</h1>
        <p>Enter marks for five subjects (0–100).</p>

        <form id="gradeForm">
            <label for="sub1">Subject 1</label>
            <input type="number" id="sub1" min="0" max="100"
                   step="any" required>

            <label for="sub2">Subject 2</label>
            <input type="number" id="sub2" min="0" max="100"
                   step="any" required>

            <label for="sub3">Subject 3</label>
            <input type="number" id="sub3" min="0" max="100"
                   step="any" required>

            <label for="sub4">Subject 4</label>
            <input type="number" id="sub4" min="0" max="100"
                   step="any" required>

            <label for="sub5">Subject 5</label>
            <input type="number" id="sub5" min="0" max="100"
                   step="any" required>

            <button type="submit">Calculate Grade</button>
        </form>

        <div id="result" aria-live="polite">
            Your result will appear here.
        </div>
    </div>

    <script>
        const form = document.getElementById("gradeForm");
        const result = document.getElementById("result");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const marks = [];

            for (let i = 1; i <= 5; i++) {
                const input = document.getElementById("sub" + i);
                const value = input.value.trim();

                if (value === "") {
                    showError("Please enter marks for all subjects.");
                    return;
                }

                const mark = Number(value);

                if (!Number.isFinite(mark) ||
                    mark < 0 || mark > 100) {
                    showError(
                        "Marks must be valid numbers between 0 and 100."
                    );
                    return;
                }

                marks.push(mark);
            }

            const total = marks.reduce(
                (sum, mark) => sum + mark, 0
            );

            const average = total / marks.length;
            const percentage = (total / 500) * 100;

            let grade;

            if (percentage >= 90) {
                grade = "A+";
            } else if (percentage >= 80) {
                grade = "A";
            } else if (percentage >= 70) {
                grade = "B";
            } else if (percentage >= 60) {
                grade = "C";
            } else if (percentage >= 50) {
                grade = "D";
            } else {
                grade = "F";
            }

            result.className = "success";
            result.innerHTML = `
                <h3>Calculation Result</h3>
                <p><strong>Total Marks:</strong>
                    ${total.toFixed(2)} / 500</p>
                <p><strong>Average:</strong>
                    ${average.toFixed(2)}</p>
                <p><strong>Percentage:</strong>
                    ${percentage.toFixed(2)}%</p>
                <p><strong>Grade:</strong> ${grade}</p>
            `;
        });

        function showError(message) {
            result.className = "error";
            result.textContent = message;
        }
    </script>
</body>
</html>
